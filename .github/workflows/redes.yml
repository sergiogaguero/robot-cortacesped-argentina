# Publica en Instagram los reels e historias de social/calendario.json cuando les llega la hora.
# Configuración (secretos IG_USER_ID e IG_ACCESS_TOKEN) en docs/redes.md.
# GitHub solo corre los "schedule" desde la rama principal: este archivo tiene que estar en master.
name: Redes

on:
  schedule:
    - cron: "7,37 * * * *" # cada 30 min (GitHub puede demorarlo unos minutos)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba: verificar la conexión y mostrar qué publicaría, sin publicar"
        type: boolean
        default: true

concurrency:
  group: redes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lo ya publicado vive en la caché de Actions (no se commitea, así no dispara deploys).
      - uses: actions/cache/restore@v4
        with:
          path: social/.estado.json
          key: redes-estado-${{ github.run_id }}
          restore-keys: redes-estado-
      - name: Publicar
        run: node scripts/social/publish.mjs ${{ inputs.dry_run && '--dry-run --check' || '' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('social/.estado.json') != ''
        with:
          path: social/.estado.json
          key: redes-estado-${{ github.run_id }}
